  TIER 6 FULL REORGANIZATION — 6-Day Split
  At Tier 6 (BE A PRO), the entire week reorganizes:
  - Tue: PUSH (Bench moves from Wed)
  - Wed: CONDITIONING (carries, loaded pulls, grip)
  - Thu: LEGS (Squat moves from Fri)
  - Fri: ARMS (from Sat)
  - Sat: MOBILITY only (arms moved to Fri)

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, runTransaction, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ⚠️ PASTE YOUR FIREBASE CONFIG HERE (from step 4 of setup guide)
const firebaseConfig = {
  apiKey: "AIzaSyCmMwFMUhui6jIy3iXOdkZA8frOgOHv9Gc",
  authDomain: "burn-the-ships.firebaseapp.com",
  projectId: "burn-the-ships",
  storageBucket: "burn-the-ships.firebasestorage.app",
  messagingSenderId: "995364647085",
  appId: "1:995364647085:web:f19e33fb504118542e5624"
};

// Make Firebase globally accessible
window.carthagoFirebase = {
  ready: false,
  user: null,
  init() {
    try {
      const app = initializeApp(firebaseConfig);
      this.auth = getAuth(app);
      this.db = getFirestore(app);
      this.provider = new GoogleAuthProvider();
      this.ready = true;

      // Handle redirect result (for mobile sign-in fallback)
      getRedirectResult(this.auth).then(result => {
        if (result && result.user) {
          console.log("Redirect sign-in successful:", result.user.email);
        }
      }).catch(err => {
        console.error("Redirect error:", err.code, err.message);
        if (err.code === "auth/unauthorized-domain") {
          alert("Domain not authorized. Add " + window.location.hostname + " to Firebase authorized domains.");
        }
      });

      // Listen for auth changes
      onAuthStateChanged(this.auth, (user) => {
        this.user = user;
        if (window.carthagoOnAuthChange) window.carthagoOnAuthChange(user);
      });
    } catch (err) {
      console.error("Firebase init failed:", err);
    }
  },
  async signIn() {
    if (!this.ready) {
      alert("Firebase not ready yet. Wait a moment and try again.");
      return;
    }
    try {
      // Try popup first on all devices (works on mobile Chrome too)
      await signInWithPopup(this.auth, this.provider);
    } catch (err) {
      console.error("Popup sign-in failed:", err.code, err.message);
      // If popup blocked or fails, fallback to redirect
      if (err.code === "auth/popup-blocked" || err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request") {
        try {
          await signInWithRedirect(this.auth, this.provider);
        } catch (err2) {
          alert("Sign-in failed: " + err2.message + "\n\nCode: " + err2.code);
        }
      } else if (err.code === "auth/unauthorized-domain") {
        alert("This domain isn't authorized in Firebase. Go to Firebase Console \u2192 Authentication \u2192 Settings \u2192 Authorized domains \u2192 add the current URL.\n\nCurrent domain: " + window.location.hostname);
      } else {
        alert("Sign-in failed: " + err.message + "\n\nCode: " + err.code + "\n\nCheck browser console for details.");
      }
    }
  },
  async signOut() {
    if (!this.ready) return;
    await signOut(this.auth);
  },
  // Sauvegarde transactionnelle : si le cloud a change depuis notre derniere synchro (autre appareil),
  // fusion a 3 voies (base = dernier etat synchronise) au lieu d'ecraser. Retourne { ok, merged, doc, updatedAt }.
  async save(data, base) {
    if (!this.ready || !this.user) return { ok: false };
    try {
      const ref = doc(this.db, "users", this.user.uid);
      return await runTransaction(this.db, async (tx) => {
        const snap = await tx.get(ref);
        const prep = window.carthagoPrepareSave(snap.exists() ? snap.data() : null, base, data);
        const updatedAt = new Date().toISOString();
        tx.set(ref, { ...prep.out, updatedAt });
        return { ok: true, merged: prep.merged, doc: prep.out, updatedAt };
      });
    } catch (err) {
      console.error("Save error:", err);
      return { ok: false };
    }
  },
  // Copie quotidienne (14 jours glissants) dans users/{uid}/backups/{YYYY-MM-DD}. Au mieux : ignore les refus de regles.
  async snapshotBackup(data) {
    if (!this.ready || !this.user || !data) return false;
    try {
      const uid = this.user.uid, d = new Date();
      const day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      await setDoc(doc(this.db, "users", uid, "backups", day), { ...data, backupOf: day });
      const old = new Date(d.getTime() - 14 * 86400000);
      const oldDay = old.getFullYear() + "-" + String(old.getMonth() + 1).padStart(2, "0") + "-" + String(old.getDate()).padStart(2, "0");
      await deleteDoc(doc(this.db, "users", uid, "backups", oldDay));
      return true;
    } catch (err) { return false; }
  },
  // Retourne le document, null si le compte n'a pas encore de document, undefined si le chargement a ECHOUE
  // (undefined bloque la sauvegarde : jamais d'ecrasement du cloud par un etat local vide).
  async load() {
    if (!this.ready || !this.user) return undefined;
    try {
      const snap = await getDoc(doc(this.db, "users", this.user.uid));
      return snap.exists() ? snap.data() : null;
    } catch (err) {
      console.error("Load error:", err);
      return undefined;
    }
  }
};

// Initialize when config is valid
if (firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
  window.carthagoFirebase.init();
}
</script>

// workoutHistory[date].exerciseData cles "A-MONDAY-2-BACK SQUAT" -> { w1..w5, r1..r5 }
function carthagoExerciseSessions(wh) {
  const out = {};
  Object.keys(wh || {}).sort().forEach(date => {
    const e = wh[date];
    if (!e || !e.completed || !e.exerciseData) return;
    Object.keys(e.exerciseData).forEach(k => {
      const m = /^[AB][-][A-Z]+[-][0-9]+[-](.+)$/.exec(k);
      if (!m || /^[0-9]+$/.test(m[1])) return;
      const en = e.exerciseData[k] || {}, sets = [];
      [1, 2, 3, 4, 5].forEach(i => { const w = parseFloat(en["w" + i]), r = parseFloat(en["r" + i]); if (!isNaN(w) && w > 0) sets.push({ w, r: isNaN(r) ? 0 : r }); });
      if (!sets.length) return;
      const max = Math.max(...sets.map(x => x.w));
      (out[m[1]] = out[m[1]] || []).push({ date, sets, max });
    });
  });
  return out;
}
// Double progression prudente : toutes les series a la charge max ont atteint les reps cibles -> +2.5 kg (+5 des 100 kg), sinon on garde.
function carthagoSuggestNext(sessions, target) {
  if (!sessions || !sessions.length || !(target > 0)) return null;
  const last = sessions[sessions.length - 1];
  const top = last.sets.filter(x => x.w === last.max);
  const up = top.length > 0 && top.every(x => x.r >= target);
  return { weight: up ? last.max + (last.max >= 100 ? 5 : 2.5) : last.max, reason: up ? "up" : "hold", last: last.max };
}

}

// Migration localStorage ancien prefixe vers carthago_ : copie seulement si la nouvelle cle est absente (null).
// Les anciennes cles restent en place (au moins une version). Les cles mortes sont supprimees sous les deux prefixes.
try {
  const OLD_PFX = "bts_"; // legacy-bts
  const DEAD_KEYS = ["tBox", "supersetOn"];
  const oldKeys = [];
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(OLD_PFX) === 0) oldKeys.push(k); }
  oldKeys.forEach(k => {
    const name = k.slice(OLD_PFX.length);
    if (DEAD_KEYS.indexOf(name) !== -1) return;
    if (localStorage.getItem("carthago_" + name) === null) localStorage.setItem("carthago_" + name, localStorage.getItem(k));
  });
  DEAD_KEYS.forEach(n => { localStorage.removeItem("bts_" + n); localStorage.removeItem("carthago_" + n); }); // legacy-bts
} catch (e) {}
